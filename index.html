<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111111">
<meta property="og:title" content="THcompany">
<meta property="og:description" content="THcompany">
<meta property="og:type" content="website"><meta property="og:image" content="https://thcompany7576.github.io/TH-company/thcompany-share-v2.png">
<title>THcompany</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:Arial,"Noto Sans KR",sans-serif}
.wrap{max-width:760px;margin:auto;padding:14px 12px 30px}
.card{background:#171717;border:2px solid #ffe000;border-radius:24px;overflow:hidden;box-shadow:0 12px 35px rgba(0,0,0,.45)}
.hero{width:100%;height:auto;display:block}
.content{padding:18px 16px 22px}
.title{font-size:30px;font-weight:900;margin:0 0 5px;color:#ffe000}
.sub{margin:0 0 18px;color:#ddd;font-size:16px}
.buttons{display:grid;grid-template-columns:1fr;gap:12px}
.btn{display:flex;align-items:center;justify-content:center;min-height:62px;border-radius:17px;text-decoration:none;font-weight:900;font-size:19px;cursor:pointer}
[hidden]{display:none!important}
.call,.kakao{background:#ffe000;color:#111}
.share,.copy{background:#2b2b2b;color:#fff;border:1px solid #4b4b4b}
.share{grid-column:1/-1}.phone{font-size:27px;font-weight:950;color:#ffe000;text-align:center;margin:22px 0 5px}
.hint{font-size:15px;color:#999;text-align:center;margin:0}
.footer{text-align:center;color:#aaa;font-size:14px;padding:15px 0 0}
@media(min-width:560px){.buttons{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <img class="hero" src="th-company-team-banner.png" alt="TH company 공통 명함 — 바이크 라이더" width="1536" height="1024">
    <div class="content">
      <h1 class="title">TH company</h1>
      <p class="sub">퀵서비스 · 배송 · 운송 · 출장서비스 · 각종 물품</p>
      <a class="btn call" style="margin-bottom:12px" href="order.html">🏍️ 퀵서비스 주문하기</a>
      <div class="buttons">
        <a class="btn call" href="tel:01021457576">📞 전화하기</a>
        <a class="btn kakao" href="https://open.kakao.com/me/THcompany" target="_blank" rel="noopener">💬 카카오톡 상담</a>
        <button id="shareCardButton" class="btn share" onclick="shareCard()">📤 명함 공유하기</button>
      </div>
      <div class="phone">010-2145-7576</div>
      <p class="hint">전화 또는 카카오톡 버튼을 눌러 바로 문의하실 수 있습니다.</p>
    </div>
  </div>
  <div class="footer">TH company · 빠르게, 안전하게, 정확하게!</div>
</div>
<script>
const shareUrl=new URL(location.href);shareUrl.searchParams.set("v","brand2");const CARD_URL=shareUrl.href;
const shareButton=document.getElementById('shareCardButton');
const shareData={title:"THcompany",text:"THcompany",url:CARD_URL};
const nativeShare=typeof navigator.share==='function'&&(!navigator.canShare||navigator.canShare(shareData));
if(!nativeShare)shareButton.textContent='🔗 명함 링크 복사';
async function shareCard(){
  if(nativeShare){try{await navigator.share(shareData)}catch(e){if(e.name!=='AbortError')await copyLink();}}
  else await copyLink();
}
async function copyLink(){
  try{await navigator.clipboard.writeText(CARD_URL);alert("온라인명함 링크가 복사되었습니다.")}
  catch(e){prompt("아래 링크를 복사해 주세요.",CARD_URL)}
}
</script>
<script src="config.js"></script><script src="sales-card.js?v=20261002-team1"></script><script src="pwa.js"></script></body>
</html>
