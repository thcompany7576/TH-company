<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>주문 접수함 | TH company</title><style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font:16px/1.6 Arial,sans-serif}main{max-width:1000px;padding:24px 16px;margin:auto}h1{color:#ffe000}section,article{padding:20px;border:1px solid #555;border-radius:16px;background:#1d1d1d;margin:18px 0}input,button{font:inherit;border-radius:10px;padding:12px}input{background:#292929;color:#fff;border:1px solid #777;display:block;width:100%;margin:8px 0 16px}label{display:block}button{border:0;background:#ffe000;color:#111;font-weight:bold;min-height:46px;cursor:pointer}.secondary{background:#333;color:#fff;border:1px solid #777}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.muted{color:#ccc}pre{font:inherit;white-space:pre-wrap;overflow-wrap:anywhere}[hidden]{display:none!important}button:disabled{opacity:.6;cursor:wait}a{color:#ffe000}#login{max-width:460px}input:focus,button:focus{outline:2px solid #ffe000;outline-offset:3px}
</style></head><body><main><h1>TH company 주문 접수함</h1><p class="muted">고객 주문 확인 · 코리아센타 입력용 복사</p><p id="notice" role="status" aria-live="polite"></p><section id="login"><h2>관리자 로그인</h2><form id="loginForm"><label>이메일<input id="email" type="email" autocomplete="username" required></label><label>비밀번호<input id="password" type="password" autocomplete="current-password" required></label><label style="display:flex;gap:10px;align-items:center"><input id="remember" type="checkbox" style="width:20px;margin:0"> 로그인 유지 (개인 컴퓨터)</label><p class="muted">체크하면 브라우저를 다시 열어도 로그인을 복원합니다.</p><button id="loginButton">로그인</button></form></section><section id="inbox" hidden><div class="row"><button id="refresh">새로고침</button><button id="logout" class="secondary">로그아웃</button><span id="count"></span></div><label>불러온 주문 검색<input id="search" type="search" placeholder="이름, 전화번호, 주소, 주문번호"></label><p class="muted">최신순으로 표시됩니다. 복사한 내용을 코리아센타에 직접 입력해 주세요.</p><div id="orders"></div><button id="more" class="secondary" hidden>이전 주문 더 보기</button></section></main><script src="config.js"></script><script src="admin.js"></script></body></html>
